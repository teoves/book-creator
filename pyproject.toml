[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-creator"
version = "0.1.0"
description = "Compile e-books (EPUB, Kindle AZW3, …) from online archives of public-domain and copyleft writings, with full source attribution."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pillow>=10.0",
]
keywords = ["epub", "ebook", "kindle", "calibre", "marxists.org", "public domain"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Text Processing :: Markup :: HTML",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bookcreator = "bookcreator.__main__:main"

[tool.setuptools.packages.find]
include = ["bookcreator*"]

[tool.setuptools.package-data]
bookcreator = ["style.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-m 'not live'"
markers = ["live: fetches real websites (opt in with: pytest -m live)"]
